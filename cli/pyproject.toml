[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nodepick-cli"
version = "0.1.0"
description = "CLI tool for nodepick.ai Node orchestration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
    "keyring>=25.0.0",
    "nodepick",
]



[project.scripts]
np = "nodepick_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nodepick_cli"]

[tool.uv.sources]
nodepick = { path = "../sdk/python" }




